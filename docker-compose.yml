# Ethereum Immersive Trainer - Docker Compose
# Default configuration for INSTRUCTOR mode
#
# ============================================
# QUICK START:
# ============================================
#   docker-compose up --build
#
# Then open: http://localhost:5173
#
# ============================================
# STUDENT MODE:
# ============================================
#   docker-compose -f docker-compose.student.yml up --build
#
# ============================================
# SHARE WITH STUDENTS:
# ============================================
#   1. Find your IP: hostname -I (Linux) or ipconfig (Windows)
#   2. Share with students:
#      - RPC URL: http://<your-ip>:8545
#      - Frontend: http://<your-ip>:5173
#

services:
  ethereum-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethereum-trainer-instructor
    ports:
      - "8545:8545"    # Blockchain RPC - share this with students
      - "5173:5173"    # Frontend Web UI
      - "3001:3001"    # Chain City indexer API
      - "3002:3002"    # Lab Terminal (PTY WebSocket)
      - "3003:3003"    # Lab Terminal fallback
      - "3004:3004"    # Lab Terminal fallback
    environment:
      - MODE=instructor
      - RPC_PORT=8545
      - FRONTEND_PORT=5173
      # INSTRUCTOR_IP: comma-separated IPs for ?mode=instructor. Use * to allow all (instructor laptop only).
      # Uncomment below if ?mode=instructor is blocked (Docker gateway IP varies by setup):
      - INSTRUCTOR_IP=*
      # Or add your specific IP: - INSTRUCTOR_IP=127.0.0.1,::1,192.168.1.100
      - TERMINAL_PORTS=3002,3003,3004
      - TERMINAL_CWD=/app
      # - DEPLOY_BEACON_LAB=1  # Uncomment to deploy Beacon Chain Lab at startup
    volumes:
      # Persist blockchain data between restarts
      - blockchain-data:/app/.hardhat
      # Persist student contracts
      - student-contracts:/app/contracts/student
    restart: unless-stopped
    networks:
      - ethereum-net
    # Resource limits (optional, uncomment if needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G

volumes:
  blockchain-data:
    driver: local
  student-contracts:
    driver: local

networks:
  ethereum-net:
    driver: bridge
